version: '3.8'

services:
  # Frontend Service (Next.js)
  frontend:
    container_name: pesabu-frontend
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      # Point to external backend URL (adjust as needed for your deployment)
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      # For server-side requests, use external URL when running separately
      - INTERNAL_API_URL=http://localhost:8000
    networks:
      - pesabu-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  pesabu-network:
    driver: bridge
    external: true  # Use existing network if backend is already running

volumes:
  pesabu_frontend_data: